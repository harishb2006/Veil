# Airlock gate policy. Every tool call an agent tries to make is checked against this file.

# Tools whose results are untrusted content (reading one "taints" the run).
untrusted_sources: [fetch_page, read_inbox, read_email, read_file]

# Tools that change the outside world; only these are gated.
risky_tools: [send_email, run_shell]

# Addresses the user trusts as recipients, in addition to anything they typed in their own task.
contacts: [priya@acme.test, team@acme.test]

# Hosts a tainted run may mention in risky-tool arguments (the sandbox's own pages). URLs with a
# query string are always refused when tainted, and so is every other host.
allowed_hosts: [shop.test, docs.devtool.test, news.test]

# Anonymous drop sites: anything sent to these (or their subdomains) is public or attacker-readable.
# The egress rule blocks them whether or not the run has read untrusted content.
drop_sites:
  - pastebin.com
  - paste.ee
  - hastebin.com
  - transfer.sh
  - file.io
  - webhook.site
  - requestbin.com
  - requestbin.net
  - pipedream.net
  - hookbin.com
  - ngrok.io
  - ngrok-free.app
  - ngrok.app
  - trycloudflare.com
  - oast.fun
  - oast.pro
  - oast.live
  - oast.site
  - oast.online
  - oast.me
  - interact.sh
  - burpcollaborator.net
  - requestcatcher.com
  - beeceptor.com

# egress: SSRF / cloud-metadata targets, drop sites above, and DNS-tunnelling hosts (a 24+ character
# high-entropy subdomain label). Hosts in allowed_hosts are never flagged by it.
rules: [secrets_never_leave, recipient_provenance, egress, shell_when_tainted, exfil_urls]
